name: FastAPI - Basic Chek

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fastapi-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Build da imagem Docker
        run: docker build -t my-fastapi-app .
