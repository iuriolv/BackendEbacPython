apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ebac-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: biblioteca
          image: iurid/backend-ebac-python:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000